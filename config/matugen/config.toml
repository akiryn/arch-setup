[config]

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel.ini'
output_path = '~/.config/fuzzel/colors.ini'

[templates.mako]
input_path = '~/.config/matugen/templates/mako-colors.conf'
output_path = '~/.config/mako/colors.conf'
post_hook = 'makoctl reload'

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar-mechabar.css'
output_path = '~/.config/waybar/themes/matugen.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.swayosd]
input_path = '~/.config/matugen/templates/swayosd-colors.css'
output_path = '~/.config/swayosd/colors.css'
post_hook = 'pkill -x swayosd-server || :; swayosd-server > /tmp/swayosd.log 2>&1 &'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path ='~/.config/kitty/matugen.conf'

[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/colors.kdl'

[templates.btop]
input_path = '~/.config/matugen/templates/btop-colors.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 -x btop || true'

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch-config.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'
post_hook = 'ya emit-to 0 app:theme'

[templates.swaylock-effects]
input_path = '~/.config/matugen/templates/swaylock-config.conf'
output_path = '~/.config/swaylock/config'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.starship]
input_path = '~/.config/matugen/templates/starship-colors.toml'
output_path = '~/.config/starship.toml'

[templates.neovim]
input_path = '~/.config/matugen/templates/neovim/neovim-colors.lua'
output_path = '~/.config/nvim/generated.lua'
post_hook = 'pkill -SIGUSR1 nvim'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/matugen'
post_hook = 'pkill -USR2 -x cava || true'

[templates.gtk3]
input_path ='~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path ='~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.gtk-folder]
input_path = '~/.config/matugen/templates/gtk-folder/recolor.sh'
output_path = '~/.cache/matugen/recoloricons.sh'
post_hook = 'bash ~/.cache/matugen/recoloricons.sh &'

[templates.fcitx5]
input_path = '~/.config/matugen/templates/fcitx5-theme.conf'
output_path = '~/.local/share/fcitx5/themes/Matugen/theme.conf'
post_hook = 'bash ~/.config/matugen/scripts/update-fcitx5-theme.sh'

[templates.wlogout]
input_path = '~/.config/matugen/templates/wlogout/colors.css'
output_path = '~/.config/wlogout/colors.css'

[templates.wlogout-recolor]
input_path = '~/.config/matugen/templates/wlogout/recolor.sh'
output_path = '~/.cache/matugen/wlogout-recolor.sh'
post_hook = 'bash ~/.cache/matugen/wlogout-recolor.sh'

[templates.gnome-accent]
input_path = '~/.config/matugen/templates/gnome-accent.py'
output_path = '~/.cache/matugen/gnome-accent.py'
post_hook = 'python3 ~/.cache/matugen/gnome-accent.py &'

#[templates.kde-color-scheme]
#input_path = '~/.config/matugen/templates/matugen-kde.conf'
#output_path = '~/.local/share/color-schemes/Matugen.colors'
