[Metadata]
Name=Matugen
Version=1
Author=Local
Description=Matugen colors with Catppuccin-inspired layout

[InputPanel]
NormalColor={{colors.on_surface.default.hex}}
HighlightColor={{colors.primary.default.hex}}
HighlightBackgroundColor={{colors.surface_container_high.default.hex}}
HighlightCandidateColor={{colors.on_primary.default.hex}}
EnableBlur=False
FullWidthHighlight=True
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=18
Right=18
Top=8
Bottom=8

[InputPanel/Background]
Image=panel.svg
Color={{colors.surface_container_high.default.hex}}

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/Highlight]
Image=highlight.svg
Color={{colors.primary.default.hex}}

[InputPanel/Highlight/Margin]
Left=18
Right=18
Top=8
Bottom=8

[Menu]
NormalColor={{colors.on_surface.default.hex}}
HighlightCandidateColor={{colors.on_primary.default.hex}}
Spacing=3

[Menu/Background]
Image=panel.svg
Color={{colors.surface_container_high.default.hex}}

[Menu/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Image=highlight.svg
Color={{colors.primary.default.hex}}

[Menu/Highlight/Margin]
Left=10
Right=10
Top=8
Bottom=8

[Menu/Separator]
Color={{colors.outline_variant.default.hex}}

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
