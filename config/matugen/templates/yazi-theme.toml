# Yazi theme generated by Matugen

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }
symlink_target = { fg = "{{colors.on_surface_variant.default.hex}}" }

find_keyword = { fg = "{{colors.tertiary.default.hex}}", bold = true, underline = true }
find_position = { fg = "{{colors.secondary.default.hex}}", bold = true }

marker_copied = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
marker_cut = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_selected = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }

count_copied = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
count_cut = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }

border_symbol = "│"
border_style = { fg = "{{colors.outline.default.hex}}" }

[indicator]
parent = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
current = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }
preview = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
sep_inner = { open = "[", close = "]" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

select_main = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

unset_main = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
unset_alt = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[status]
sep_left = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

perm_type = { fg = "{{colors.primary.default.hex}}" }
perm_read = { fg = "{{colors.secondary.default.hex}}" }
perm_write = { fg = "{{colors.tertiary.default.hex}}" }
perm_exec = { fg = "{{colors.primary.default.hex}}", bold = true }
perm_sep = { fg = "{{colors.outline.default.hex}}" }

progress_label = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
progress_error = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[which]
cols = 3
mask = { bg = "{{colors.surface_container.default.hex}}" }
cand = { fg = "{{colors.primary.default.hex}}", bold = true }
rest = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc = { fg = "{{colors.on_surface.default.hex}}" }
separator = " ▶ "
separator_style = { fg = "{{colors.outline.default.hex}}" }

[confirm]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}", bold = true }
body = { fg = "{{colors.on_surface.default.hex}}" }
list = { fg = "{{colors.on_surface_variant.default.hex}}" }
btn_yes = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
btn_no = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[spot]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}", bold = true }
tbl_col = { fg = "{{colors.primary.default.hex}}" }
tbl_cell = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

[notify]
title_info = { fg = "{{colors.primary.default.hex}}" }
title_warn = { fg = "{{colors.tertiary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[pick]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }

[input]
border = { fg = "{{colors.primary.default.hex}}" }
value = { fg = "{{colors.on_surface.default.hex}}" }

[cmp]
border = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[tasks]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}", bold = true }
hovered = { fg = "{{colors.primary.default.hex}}", underline = true }

[help]
on = { fg = "{{colors.primary.default.hex}}" }
run = { fg = "{{colors.on_surface.default.hex}}" }
footer = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }

[filetype]
rules = [
    # 特殊文件优先
    { url = "*", is = "orphan", fg = "{{colors.on_error_container.default.hex}}", bg = "{{colors.error_container.default.hex}}" },
    { url = "*/", fg = "{{colors.primary.default.hex}}", bold = true },

    # 图片、媒体、压缩包和文档
    { mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "application/{pdf,doc,rtf}", fg = "{{colors.secondary.default.hex}}" },

    # 可执行文件与普通文件
    { url = "*", is = "exec", fg = "{{colors.primary.default.hex}}", bold = true },
    { url = "*", fg = "{{colors.on_surface.default.hex}}" },
]
