# Swaylock Effects config generated by Matugen

# 背景与模糊
screenshots
effect-blur=10x5

# 时钟
clock

# 输入指示器
indicator
indicator-radius=200
indicator-thickness=15

# 默认状态
ring-color={{colors.primary_container.default.hex_stripped}}
inside-color={{colors.surface_container.default.hex_stripped}}
text-color={{colors.on_surface.default.hex_stripped}}
line-color={{colors.outline.default.hex_stripped}}
separator-color={{colors.primary_container.default.hex_stripped}}

# 输入与退格高亮
key-hl-color={{colors.primary.default.hex_stripped}}
bs-hl-color={{colors.error.default.hex_stripped}}

# 清空输入
ring-clear-color={{colors.secondary.default.hex_stripped}}
inside-clear-color={{colors.secondary_container.default.hex_stripped}}
text-clear-color={{colors.on_secondary_container.default.hex_stripped}}
line-clear-color={{colors.outline.default.hex_stripped}}

# 正在验证
ring-ver-color={{colors.tertiary_container.default.hex_stripped}}
inside-ver-color={{colors.tertiary.default.hex_stripped}}
text-ver-color={{colors.on_tertiary.default.hex_stripped}}
line-ver-color={{colors.outline.default.hex_stripped}}

# 密码错误
ring-wrong-color={{colors.error_container.default.hex_stripped}}
inside-wrong-color={{colors.error.default.hex_stripped}}
text-wrong-color={{colors.on_error.default.hex_stripped}}
line-wrong-color={{colors.outline.default.hex_stripped}}

# Caps Lock 状态
ring-caps-lock-color={{colors.secondary.default.hex_stripped}}
inside-caps-lock-color={{colors.secondary_container.default.hex_stripped}}
text-caps-lock-color={{colors.on_secondary_container.default.hex_stripped}}
line-caps-lock-color={{colors.outline.default.hex_stripped}}
caps-lock-key-hl-color={{colors.primary.default.hex_stripped}}
caps-lock-bs-hl-color={{colors.error.default.hex_stripped}}

# 键盘布局提示
layout-bg-color={{colors.surface_container.default.hex_stripped}}
layout-border-color={{colors.outline.default.hex_stripped}}
layout-text-color={{colors.on_surface.default.hex_stripped}}
