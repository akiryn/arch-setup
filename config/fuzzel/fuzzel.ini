[main]
launch-prefix=sh -c 'exec ~/.config/fuzzel/scripts/fuzzel-web-search "$@"' --
include=~/.config/fuzzel/colors.ini
terminal=kitty -e

font=sans-serif:size=13
lines=9
width=35
horizontal-pad=40
vertical-pad=15
inner-pad=5
line-height=25

[border]
width=2
radius=8

[key-bindings]
execute-input=Shift+Return
