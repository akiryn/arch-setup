# Yazi theme generated by Matugen

[mgr]
cwd = { fg = "#86d1ea" }
symlink_target = { fg = "#bfc8cc" }

find_keyword = { fg = "#c1c4eb", bold = true, underline = true }
find_position = { fg = "#b3cad3", bold = true }

marker_copied = { fg = "#86d1ea", bg = "#86d1ea" }
marker_cut = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked = { fg = "#b3cad3", bg = "#b3cad3" }
marker_selected = { fg = "#c1c4eb", bg = "#c1c4eb" }

count_copied = { fg = "#003642", bg = "#86d1ea" }
count_cut = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#2a2e4d", bg = "#c1c4eb" }

border_symbol = "│"
border_style = { fg = "#899296" }

[indicator]
parent = { fg = "#dee3e6", bg = "#252b2d" }
current = { fg = "#b3ebff", bg = "#004e5f", bold = true }
preview = { fg = "#dee3e6", bg = "#252b2d" }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#003642", bg = "#86d1ea", bold = true }
inactive = { fg = "#bfc8cc", bg = "#1b2023" }
sep_inner = { open = "[", close = "]" }

[mode]
normal_main = { fg = "#003642", bg = "#86d1ea", bold = true }
normal_alt = { fg = "#bfc8cc", bg = "#252b2d" }

select_main = { fg = "#1d343b", bg = "#b3cad3", bold = true }
select_alt = { fg = "#bfc8cc", bg = "#252b2d" }

unset_main = { fg = "#2a2e4d", bg = "#c1c4eb", bold = true }
unset_alt = { fg = "#bfc8cc", bg = "#252b2d" }

[status]
sep_left = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

perm_type = { fg = "#86d1ea" }
perm_read = { fg = "#b3cad3" }
perm_write = { fg = "#c1c4eb" }
perm_exec = { fg = "#86d1ea", bold = true }
perm_sep = { fg = "#899296" }

progress_label = { fg = "#dee3e6", bold = true }
progress_normal = { fg = "#86d1ea", bg = "#252b2d" }
progress_error = { fg = "#ffb4ab", bg = "#252b2d" }

[which]
cols = 3
mask = { bg = "#1b2023" }
cand = { fg = "#86d1ea", bold = true }
rest = { fg = "#bfc8cc" }
desc = { fg = "#dee3e6" }
separator = " ▶ "
separator_style = { fg = "#899296" }

[confirm]
border = { fg = "#86d1ea" }
title = { fg = "#86d1ea", bold = true }
body = { fg = "#dee3e6" }
list = { fg = "#bfc8cc" }
btn_yes = { fg = "#003642", bg = "#86d1ea" }
btn_no = { fg = "#dee3e6", bg = "#252b2d" }

[spot]
border = { fg = "#86d1ea" }
title = { fg = "#86d1ea", bold = true }
tbl_col = { fg = "#86d1ea" }
tbl_cell = { fg = "#b3ebff", bg = "#004e5f" }

[notify]
title_info = { fg = "#86d1ea" }
title_warn = { fg = "#c1c4eb" }
title_error = { fg = "#ffb4ab" }

[pick]
border = { fg = "#86d1ea" }
active = { fg = "#86d1ea", bold = true }
inactive = { fg = "#bfc8cc" }

[input]
border = { fg = "#86d1ea" }
value = { fg = "#dee3e6" }

[cmp]
border = { fg = "#86d1ea", bg = "#1b2023" }

[tasks]
border = { fg = "#86d1ea" }
title = { fg = "#86d1ea", bold = true }
hovered = { fg = "#86d1ea", underline = true }

[help]
on = { fg = "#86d1ea" }
run = { fg = "#dee3e6" }
footer = { fg = "#1d343b", bg = "#b3cad3" }

[filetype]
rules = [
    # 特殊文件优先
    { url = "*", is = "orphan", fg = "#ffdad6", bg = "#93000a" },
    { url = "*/", fg = "#86d1ea", bold = true },

    # 图片、媒体、压缩包和文档
    { mime = "image/*", fg = "#c1c4eb" },
    { mime = "{audio,video}/*", fg = "#b3cad3" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c1c4eb" },
    { mime = "application/{pdf,doc,rtf}", fg = "#b3cad3" },

    # 可执行文件与普通文件
    { url = "*", is = "exec", fg = "#86d1ea", bold = true },
    { url = "*", fg = "#dee3e6" },
]
