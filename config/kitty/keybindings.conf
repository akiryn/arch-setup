# Kitty 自定义快捷键
# 在此扩充标签页、窗口布局等快捷键；由 kitty.conf 统一加载。

# 屏幕文字操作：先按 Ctrl+Shift+P，松开后按第二个键（不要按 Shift）。
# @ = 复制到剪贴板；- = 插入当前终端。选中后检查内容，再执行命令。

# u / URL：复制网址。直接打开网址使用 Kitty 默认 Ctrl+Shift+E。
map ctrl+shift+p>u kitten hints --type url --program @

# f / File：把屏幕上的路径插入当前命令，例如先输入 nvim 加空格。
map ctrl+shift+p>f kitten hints --type path --program -

# h / Hash：把提交哈希插入当前命令，例如先输入 git show 加空格。
map ctrl+shift+p>h kitten hints --type hash --program -

# l / Line：复制整行日志，不直接将整行发送到 Shell。
# 此处覆盖 Kitty 默认的“插入整行”，避免意外回填日志或命令。
map ctrl+shift+p>l kitten hints --type line --program @

# n / Number：识别 path:line，在新标签页用 Neovim 打开对应行。
# 相对路径基于当前工作目录解析；绝对路径最可靠。
map ctrl+shift+p>n kitten hints --type linenum --linenum-action tab nvim +{line} {path}
