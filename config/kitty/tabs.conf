# 标签栏结构与文字样式；颜色在 current-theme.conf，快捷键在 keybindings.conf。
# 至少两个标签页才显示标签栏
tab_bar_min_tabs 2
# 样式：fade、separator、powerline 等
tab_bar_style powerline
# Powerline 分隔形状：angled、slanted、round
tab_powerline_style slanted
# 标签文字样式：normal、bold、italic、bold-italic
active_tab_font_style bold-italic
inactive_tab_font_style normal
