"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = 'matugen'

format = '[](fg:os_bg)$os[](fg:os_bg bg:dir_bg)$directory${custom.directory_tail}($git_branch$git_commit$git_status$git_state[](fg:git_bg)) '
right_format = '$status$cmd_duration$jobs$python$conda$username$hostname'

# 只调整这里即可更换各区域的颜色
[palettes.matugen]
os_bg = '#b3cad3'
os_fg = '#1d343b'

dir_bg = '#86d1ea'
dir_fg = '#003642'

git_bg = '#c1c4eb'
git_fg = '#2a2e4d'

panel_bg = '#1b2023'
success = '#a6e3a1'
error = '#ffb4ab'
accent = '#86d1ea'
cyan = '#b3cad3'

duration_bg = '#b3cad3'
duration_fg = '#1d343b'

[os]
disabled = false
format = '[ $symbol ]($style)'
style = 'fg:os_fg bg:os_bg'

[os.symbols]
Arch = ''

[directory]
format = '[ $path$read_only ]($style)'
style = 'bold fg:dir_fg bg:dir_bg'
truncation_length = 5
truncation_symbol = '…/'
truncate_to_repo = true
read_only = ' '

[status]
disabled = false
format = '$symbol'
style = 'fg:error bg:panel_bg'
success_style = 'fg:success bg:panel_bg'
failure_style = 'fg:error bg:panel_bg'
symbol = '[](fg:panel_bg)[ ✘ $status ](fg:error bg:panel_bg)'
success_symbol = '[](fg:panel_bg)[ ✔ ](fg:success bg:panel_bg)'

[cmd_duration]
min_time = 3000
format = '[](fg:duration_bg bg:panel_bg)[ $duration  ]($style)'
style = 'fg:duration_fg bg:duration_bg'

[jobs]
format = '[](fg:panel_bg)[ $symbol$number ]($style)'
style = 'fg:cyan bg:panel_bg'
symbol = ' '
number_threshold = 2
symbol_threshold = 1

[python]
format = '([](fg:panel_bg)[ $virtualenv  ](fg:accent bg:panel_bg))'

[conda]
format = '[](fg:panel_bg)[ $environment  ](fg:accent bg:panel_bg)'
ignore_base = true

[username]
format = '[](fg:panel_bg)[ $user ]($style)'
style_user = 'fg:accent bg:panel_bg'
style_root = 'fg:error bg:panel_bg'
show_always = false

[hostname]
format = '[@$hostname ]($style)'
style = 'fg:accent bg:panel_bg'
ssh_only = true

[git_branch]
format = '[](fg:dir_bg bg:git_bg)[  $branch ]($style)'
style = 'fg:git_fg bg:git_bg'

[git_commit]
format = '[ @$hash ]($style)'
style = 'fg:git_fg bg:git_bg'
only_detached = true

[git_status]
format = '([ $all_status$ahead_behind ]($style))'
style = 'bold fg:git_fg bg:git_bg'
conflicted = '=${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '*${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[git_state]
format = '[ $state( $progress_current/$progress_total) ]($style)'
style = 'bold fg:git_fg bg:git_bg'

[custom.directory_tail]
when = '! git rev-parse --git-dir >/dev/null 2>&1'
command = "printf ''"
shell = ['sh']
format = '[$output](fg:dir_bg)'

